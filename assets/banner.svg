<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cloud-glow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cloud-glow-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="radial-ambient" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="radial-left" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />
  <rect width="1200" height="320" rx="16" fill="url(#radial-ambient)" />
  <rect width="1200" height="320" rx="16" fill="url(#radial-left)" />
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Abstract Vector Cloud / Flow Lines (Right Side) -->
  <g transform="translate(760, 30)">
    <!-- Ambient Cloud Blobs -->
    <path d="M 140 160 C 120 160 100 148 95 130 C 80 130 65 118 65 100 C 65 82 80 70 95 70 C 102 45 125 28 155 28 C 190 28 220 50 225 80 C 240 80 255 92 255 110 C 255 128 240 142 225 142 C 220 152 205 160 190 160 Z"
          fill="url(#cloud-glow-1)" filter="blur(16px)" />
    
    <path d="M 210 200 C 190 200 175 190 170 175 C 158 175 145 165 145 150 C 145 136 158 125 170 125 C 176 105 195 90 220 90 C 250 90 275 108 280 132 C 292 132 305 142 305 158 C 305 172 292 185 280 185 C 275 194 262 200 250 200 Z"
          fill="url(#cloud-glow-2)" filter="blur(22px)" />

    <!-- Stylized Geometric Clouds & Network Nodes -->
    <path d="M 120 180 C 95 180 75 163 70 140 C 50 140 35 125 35 105 C 35 85 52 70 72 70 C 80 40 110 20 148 20 C 190 20 225 45 232 82 C 250 82 268 98 268 118 C 268 138 250 155 232 155 L 120 155 Z"
          fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.6" />

    <path d="M 190 210 C 170 210 152 196 148 176 C 132 176 120 164 120 148 C 120 132 134 120 150 120 C 156 96 180 80 210 80 C 244 80 272 100 278 130 C 292 130 306 142 306 158 C 306 174 292 188 278 188 L 190 188 Z"
          fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.7" />

    <!-- Glowing Node Points -->
    <circle cx="148" cy="20" r="4.5" fill="#38bdf8" />
    <circle cx="148" cy="20" r="9" fill="#38bdf8" fill-opacity="0.3" />
    <circle cx="268" cy="118" r="4" fill="#06b6d4" />
    <circle cx="210" cy="80" r="4" fill="#a855f7" />
    <circle cx="306" cy="158" r="4" fill="#818cf8" />
    <circle cx="120" cy="148" r="3.5" fill="#38bdf8" />
    <circle cx="72" cy="70" r="3.5" fill="#38bdf8" />

    <!-- Connecting Data Pathways -->
    <line x1="148" y1="20" x2="210" y2="80" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4,4" />
    <line x1="210" y1="80" x2="278" y2="130" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="120" y1="148" x2="190" y2="188" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- Mini Floating Console Pill -->
    <g transform="translate(140, 225)">
      <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#10b981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">CHECK MY PROGRESS</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 60)">
    <!-- Terminal Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="215" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="14" y="19" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#38bdf8">&gt;_</text>
      <text x="38" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1.2">STUDY REPO &amp; LABS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">
      Cloud Skills Lab Manuals
    </text>

    <!-- Gradient Tagline Bar -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="url(#primary-glow)">
      Stuck on a cloud lab? Clear step-by-step guides with common errors explained.
    </text>

    <!-- Supporting Micro Badges -->
    <g transform="translate(0, 155)">
      <!-- Badge 1: Zero Experience -->
      <g transform="translate(0, 0)">
        <rect width="168" height="30" rx="8" fill="#131c31" stroke="#253556" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#38bdf8" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Beginner Friendly</text>
      </g>

      <!-- Badge 2: Single Command Blocks -->
      <g transform="translate(180, 0)">
        <rect width="168" height="30" rx="8" fill="#131c31" stroke="#253556" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#818cf8" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Step-by-Step Flow</text>
      </g>

      <!-- Badge 3: Common Errors -->
      <g transform="translate(360, 0)">
        <rect width="180" height="30" rx="8" fill="#131c31" stroke="#253556" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#34d399" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Error Fixes Included</text>
      </g>
    </g>
  </g>
</svg>
